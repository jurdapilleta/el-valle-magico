<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#BFE3FF" />
    <meta name="description" content="Un valle tranquilo para aprender jugando con Luna." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Valle Mágico" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>El Valle Mágico</title>
    <style>
      /* First paint, before any script has loaded: the same sky and a pulsing star. */
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(#bfe3ff, #fff1f8);
      }
      .splash svg {
        width: min(34vmin, 180px);
        opacity: 0.7;
        animation: splash 0.9s ease-in-out infinite alternate;
      }
      @keyframes splash {
        to {
          transform: scale(1.12);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced as soon as the game mounts. -->
      <div class="splash" role="status" aria-label="Cargando">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path
            d="M50 6 L61 37 L94 38 L68 58 L77 90 L50 71 L23 90 L32 58 L6 38 L39 37 Z"
            fill="#FFD972"
            stroke="#FFFFFF"
            stroke-width="5"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
